# Carga la topologia de eventos al arrancar el broker, antes de que se conecte
# cualquier servicio. Sin esto, un evento publicado antes de que su consumidor
# declare la cola no tiene a donde ir y se pierde (o ingreso responde 503).
load_definitions = /etc/rabbitmq/definitions.json

# Contadores de la API de administracion cada 1 s (por defecto 5 s). Los usan
# el monitor y las demos para ver cuantos eventos esperan en cada cola.
collect_statistics_interval = 1000
